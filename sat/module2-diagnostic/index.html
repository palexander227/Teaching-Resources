<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SAT Mathematics — Module 2</title><style>
:root { --bg:#edf4fb; --panel:#fff; --ink:#172033; --muted:#5b677a; --blue:#163b8c; --accent:#2f6df6; --line:#d8e5f2; --soft:rgba(15,23,42,.08); }
*{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}.app-shell{display:grid;grid-template-columns:minmax(0,1fr)340px;height:100vh;overflow:hidden}.document-pane{height:100vh;overflow-y:auto;padding:18px}.doc-header{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 14px 32px var(--soft);padding:18px 22px;margin-bottom:18px;position:sticky;top:0;z-index:5}.doc-header h1{margin:0;color:var(--blue);font-family:Arial,sans-serif;font-size:1.25rem}.doc-header p{margin:6px 0 0;color:var(--muted);font-family:Arial,sans-serif;font-size:.92rem}.pdf-page-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 28px var(--soft);padding:14px;margin-bottom:18px}.page-label{font-family:Arial,sans-serif;color:var(--blue);font-weight:800;font-size:.88rem;margin:0 0 10px 4px}.pdf-page-card img{display:block;width:100%;max-width:850px;margin:0 auto;height:auto;border-radius:8px;background:white}.answer-sidebar{height:100vh;overflow-y:auto;background:#f8fbff;border-left:1px solid var(--line);padding:18px 16px 32px;box-shadow:-10px 0 28px rgba(15,23,42,.05)}.side-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 12px 28px var(--soft)}.side-card h2{margin:0;font-family:Arial,sans-serif;font-size:1.2rem;color:var(--blue)}.side-card .note{margin:8px 0 16px;color:var(--muted);line-height:1.4;font-family:Arial,sans-serif;font-size:.9rem}.student-info{display:grid;gap:10px;margin-bottom:18px}.student-info label{display:grid;gap:5px;font-family:Arial,sans-serif;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.student-info input{width:100%;border:1px solid #b9c9dd;border-radius:10px;padding:9px 10px;font-size:.95rem;background:#fbfdff;color:var(--ink);text-transform:none;letter-spacing:0}.answers{display:grid;gap:10px}.answer-row{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;gap:8px;padding:8px;border:1px solid #e3edf7;border-radius:12px;background:#fbfdff}.answer-row span{font-family:Arial,sans-serif;font-weight:800;color:var(--blue);text-align:right}.answer-row input{width:100%;border:1px solid #b9c9dd;border-radius:9px;padding:8px 9px;font-size:.95rem;background:white}.button-row{display:grid;gap:10px;margin-top:18px}button{border:0;border-radius:12px;padding:12px 14px;font-size:.96rem;font-weight:800;cursor:pointer;font-family:Arial,sans-serif}.primary{background:var(--accent);color:white}.secondary{background:#e7f0ff;color:var(--blue);border:1px solid #c7dcff}#status{margin-top:14px;padding:12px;border-radius:12px;background:#f0f6ff;color:var(--blue);font-family:Arial,sans-serif;font-size:.88rem;display:none}@media(max-width:900px){.app-shell{grid-template-columns:1fr;grid-template-rows:58vh 42vh}.document-pane{height:58vh;padding:12px}.answer-sidebar{height:42vh;border-left:0;border-top:1px solid var(--line)}}
</style></head><body><div class="app-shell"><main class="document-pane"><header class="doc-header"><h1>SAT Mathematics — Module 2</h1><p>Original PDF pages on the left; student answer spaces fixed on the right.</p></header><section class="pdf-page-card" id="page-1"><div class="page-label">Page 1</div><img src="assets/page-1.jpg" alt="SAT Mathematics Module 2 page 1"></section>
<section class="pdf-page-card" id="page-2"><div class="page-label">Page 2</div><img src="assets/page-2.jpg" alt="SAT Mathematics Module 2 page 2"></section>
<section class="pdf-page-card" id="page-3"><div class="page-label">Page 3</div><img src="assets/page-3.jpg" alt="SAT Mathematics Module 2 page 3"></section>
<section class="pdf-page-card" id="page-4"><div class="page-label">Page 4</div><img src="assets/page-4.jpg" alt="SAT Mathematics Module 2 page 4"></section>
<section class="pdf-page-card" id="page-5"><div class="page-label">Page 5</div><img src="assets/page-5.jpg" alt="SAT Mathematics Module 2 page 5"></section></main><aside class="answer-sidebar"><section class="side-card"><h2>Answer Sheet</h2><p class="note">Enter one response for each question. This preview downloads a local CSV; Google Sheets submission can be connected next.</p><div class="student-info"><label>Student Name<input id="studentName" type="text" autocomplete="name"></label><label>Class / Section<input id="section" type="text"></label><label>Date<input id="date" type="text"></label></div><div class="answers"><label class="answer-row"><span>1.</span><input id="q1" name="q1" type="text" autocomplete="off"></label>
<label class="answer-row"><span>2.</span><input id="q2" name="q2" type="text" autocomplete="off"></label>
<label class="answer-row"><span>3.</span><input id="q3" name="q3" type="text" autocomplete="off"></label>
<label class="answer-row"><span>4.</span><input id="q4" name="q4" type="text" autocomplete="off"></label>
<label class="answer-row"><span>5.</span><input id="q5" name="q5" type="text" autocomplete="off"></label>
<label class="answer-row"><span>6.</span><input id="q6" name="q6" type="text" autocomplete="off"></label>
<label class="answer-row"><span>7.</span><input id="q7" name="q7" type="text" autocomplete="off"></label>
<label class="answer-row"><span>8.</span><input id="q8" name="q8" type="text" autocomplete="off"></label>
<label class="answer-row"><span>9.</span><input id="q9" name="q9" type="text" autocomplete="off"></label>
<label class="answer-row"><span>10.</span><input id="q10" name="q10" type="text" autocomplete="off"></label>
<label class="answer-row"><span>11.</span><input id="q11" name="q11" type="text" autocomplete="off"></label>
<label class="answer-row"><span>12.</span><input id="q12" name="q12" type="text" autocomplete="off"></label>
<label class="answer-row"><span>13.</span><input id="q13" name="q13" type="text" autocomplete="off"></label>
<label class="answer-row"><span>14.</span><input id="q14" name="q14" type="text" autocomplete="off"></label>
<label class="answer-row"><span>15.</span><input id="q15" name="q15" type="text" autocomplete="off"></label>
<label class="answer-row"><span>16.</span><input id="q16" name="q16" type="text" autocomplete="off"></label>
<label class="answer-row"><span>17.</span><input id="q17" name="q17" type="text" autocomplete="off"></label>
<label class="answer-row"><span>18.</span><input id="q18" name="q18" type="text" autocomplete="off"></label>
<label class="answer-row"><span>19.</span><input id="q19" name="q19" type="text" autocomplete="off"></label>
<label class="answer-row"><span>20.</span><input id="q20" name="q20" type="text" autocomplete="off"></label>
<label class="answer-row"><span>21.</span><input id="q21" name="q21" type="text" autocomplete="off"></label>
<label class="answer-row"><span>22.</span><input id="q22" name="q22" type="text" autocomplete="off"></label></div><div class="button-row"><button class="primary" onclick="saveCSV()">Download Responses CSV</button><button class="secondary" onclick="clearAnswers()">Clear Answers</button></div><div id="status"></div></section></aside></div><script>
document.getElementById("date").value = new Date().toLocaleDateString();
function collectResponses(){const data={studentName:document.getElementById("studentName").value.trim(),section:document.getElementById("section").value.trim(),date:document.getElementById("date").value.trim()};for(let i=1;i<=22;i++){data[`q${i}`]=document.getElementById(`q${i}`).value.trim()}return data}
function csvEscape(value){return `"${String(value).replaceAll('"','""')}"`}
function saveCSV(){const data=collectResponses();const headers=Object.keys(data);const values=headers.map(k=>csvEscape(data[k]));const csv=headers.join(",")+"\n"+values.join(",");const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});const url=URL.createObjectURL(blob);const safeName=data.studentName?data.studentName.replace(/[^a-z0-9]/gi,"_").toLowerCase():"student";const a=document.createElement("a");a.href=url;a.download=`sat_module2_responses_${safeName}.csv`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);const status=document.getElementById("status");status.style.display="block";status.textContent="Responses CSV downloaded."}
function clearAnswers(){if(!confirm("Clear all answer fields?"))return;for(let i=1;i<=22;i++){document.getElementById(`q${i}`).value=""}const status=document.getElementById("status");status.style.display="block";status.textContent="Answer fields cleared."}
</script></body></html>
