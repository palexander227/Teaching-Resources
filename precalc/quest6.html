<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Final Prep Quest 6</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.5;
    }

    h1 {
      text-align: center;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 1.1rem;
      box-sizing: border-box;
    }

    .problem {
      border: 1px solid #ccc;
      padding: 15px;
      margin: 20px 0;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>

<body>
  <h1>Final Prep Quest 6</h1>

  <p>
    Enter your answers below. The problems are on your paper copy.
    Submit only once.
  </p>

  <div class="field">
    <label for="studentName">Student Name</label>
    <input type="text" id="studentName" placeholder="First and last name" required />
  </div>

  <div class="problem">
    <label for="q1">Problem 1</label>
    <input type="number" id="q1" placeholder="Enter answer" />
  </div>

  <div class="problem">
    <label for="q2">Problem 2</label>
    <input type="number" id="q2" placeholder="Enter answer" />
  </div>

  <div class="problem">
    <label for="q3">Problem 3</label>
    <input type="number" id="q3" placeholder="Enter rounded answer" />
  </div>

  <button id="submitBtn" onclick="submitQuest()">Submit Quest</button>

  <div id="status"></div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxKPFurJlGBHJOOipygtJG9eWUlBZku_DRtoNuIL8ruDPt8GhSH1KRF_zcI2qOhkYOiug/exec";

    async function submitQuest() {
      const submitBtn = document.getElementById("submitBtn");
      const status = document.getElementById("status");

      const studentName = document.getElementById("studentName").value.trim();
      const q1 = document.getElementById("q1").value.trim();
      const q2 = document.getElementById("q2").value.trim();
      const q3 = document.getElementById("q3").value.trim();

      if (!studentName) {
        status.textContent = "Please enter your name.";
        return;
      }

      if (q1 === "" || q2 === "" || q3 === "") {
        status.textContent = "Please answer all three problems before submitting.";
        return;
      }

      submitBtn.disabled = true;
      status.textContent = "Submitting...";

      const payload = {
        studentName: studentName,
        q1: q1,
        q2: q2,
        q3: q3,
        submittedAtClient: new Date().toISOString()
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        status.textContent = "Submitted successfully. You may close this page.";
      } catch (error) {
        submitBtn.disabled = false;
        status.textContent = "Submission failed. Please notify your teacher.";
        console.error(error);
      }
    }
  </script>
</body>
</html>
