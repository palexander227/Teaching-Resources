<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quest 5 Portal</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 24px;
      line-height: 1.5;
    }

    h1 {
      text-align: center;
    }

    .problem, .name-field {
      margin-bottom: 24px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
    }

    input[type="text"] {
      font-size: 1rem;
      padding: 8px;
      width: 220px;
    }

    .choices label {
      display: inline-block;
      font-weight: normal;
      margin-right: 20px;
    }

    button {
      font-size: 1rem;
      padding: 10px 18px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>Quest 5 Answer Portal</h1>
  <p><strong>Version 2</strong> Problem 1 Updated </p>

  <form id="answerForm">
    <div class="name-field">
      <label for="studentName">Name</label>
      <input type="text" id="studentName" required />
    </div>

    <div class="problem">
      <label>Problem 1</label>
      <div class="choices">
        <label><input type="radio" name="problem1" value="A" required /> A</label>
        <label><input type="radio" name="problem1" value="B" /> B</label>
        <label><input type="radio" name="problem1" value="C" /> C</label>
        <label><input type="radio" name="problem1" value="D" /> D</label>
      </div>
    </div>

    <div class="problem">
      <label for="problem2">Problem 2</label>
      <input type="text" id="problem2" required />
    </div>

    <div class="problem">
      <label for="problem3">Problem 3</label>
      <input type="text" id="problem3" required />
    </div>

    <div class="problem">
      <label for="problem4">Problem 4</label>
      <input type="text" id="problem4" required /> %
    </div>

    <div class="problem">
      <label for="problem5">Problem 5</label>
      <input type="text" id="problem5" required /> years
    </div>

    <button type="submit">Submit</button>
  </form>

  <div id="status"></div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwBAqs6PbmtNyfumsDQTR-AzbwiyGT382fd6RCLv9XrrSwAbxLLICgQi4RvRDR9Uu8h/exec";

    const answerKey = {
      problem1: "B",
      problem2: "11",
      problem3: "-336",
      problem4: "6",
      problem5: "12"
    };

    function clean(value) {
      return String(value).trim().toLowerCase();
    }

    document.getElementById("answerForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const form = document.getElementById("answerForm");
      const status = document.getElementById("status");

      status.textContent = "Submitting...";

      const problem1 = document.querySelector('input[name="problem1"]:checked').value;
      const problem2 = document.getElementById("problem2").value.trim();
      const problem3 = document.getElementById("problem3").value.trim();
      const problem4 = document.getElementById("problem4").value.trim();
      const problem5 = document.getElementById("problem5").value.trim();

      const score =
        Number(clean(problem1) === clean(answerKey.problem1)) +
        Number(clean(problem2) === clean(answerKey.problem2)) +
        Number(clean(problem3) === clean(answerKey.problem3)) +
        Number(clean(problem4) === clean(answerKey.problem4)) +
        Number(clean(problem5) === clean(answerKey.problem5));

      const data = {
        studentName: document.getElementById("studentName").value.trim(),
        problem1: problem1,
        problem2: problem2,
        problem3: problem3,
        problem4: problem4,
        problem5: problem5,
        score: score
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(data)
      })
      .then(() => {
        status.textContent = "Submitted. Score: " + score + "/5";
        form.reset();
      })
      .catch(() => {
        status.textContent = "Submission failed. Please tell your teacher.";
      });
    });
  </script>
</body>
</html>
