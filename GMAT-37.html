<!DOCTYPE html>
<html>
<head>

<title>GMAT Diagnostic</title>

<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>

body{
font-family:Arial;
max-width:900px;
margin:auto;
padding:40px;
background:#f4f6fa;
}

#panel{
background:white;
padding:30px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

.answers label{
display:block;
margin:6px 0;
}

button{
margin-top:20px;
padding:10px 20px;
font-size:16px;
}

#dsLegend{
display:none;
background:#eef3f9;
padding:15px;
border-radius:6px;
margin-bottom:20px;
}

#timer{
float:right;
font-weight:bold;
}

</style>

</head>

<body>

<div id="panel">

<h2>GMAT Diagnostic <span id="timer">45:00</span></h2>

<div id="dsLegend">

<b>Data Sufficiency Answer Choices</b>

<p>
A. Statement (1) ALONE sufficient<br>
B. Statement (2) ALONE sufficient<br>
C. BOTH together sufficient<br>
D. EACH statement alone sufficient<br>
E. NOT sufficient
</p>

</div>

<div id="question"></div>

<div id="answers"></div>

<button onclick="nextQuestion()">Next</button>

<div id="result"></div>

</div>

<script>

/* QUESTION BANK */

const questions=[];

/* 20 Quant Questions */

for(let i=1;i<=20;i++){

questions.push({

type:"quant",

text:`${i}. Solve \\(2x+5=17\\)`,

choices:["4","5","6","7","8"],

correct:2

});

}

/* 10 Data Sufficiency Questions */

for(let i=21;i<=30;i++){

questions.push({

type:"ds",

text:`${i}. DATA SUFFICIENCY<br><br>Is \\(x>0\\)?<br>(1) \\(x^2>0\\)<br>(2) \\(x^3>0\\)`,

choices:["A","B","C","D","E"],

correct:1

});

}

let index=0;
let score=0;

function render(){

let q=questions[index];

document.getElementById("question").innerHTML=q.text;

let html="";

q.choices.forEach((c,i)=>{

html+=`<label><input type="radio" name="ans" value="${i}"> ${c}</label>`;

});

document.getElementById("answers").innerHTML=html;

if(q.type==="ds"){
document.getElementById("dsLegend").style.display="block";
}

MathJax.typesetPromise();

}

function nextQuestion(){

let sel=document.querySelector('input[name="ans"]:checked');

if(sel){

if(parseInt(sel.value)===questions[index].correct){
score++;
}

}

index++;

if(index>=questions.length){

document.getElementById("question").innerHTML="";
document.getElementById("answers").innerHTML="";
document.querySelector("button").style.display="none";

document.getElementById("result").innerHTML="<h2>Score: "+score+" / "+questions.length+"</h2>";

return;

}

render();

}

render();

/* TIMER */

let time=2700;

setInterval(function(){

time--;

let m=Math.floor(time/60);
let s=time%60;

if(s<10)s="0"+s;

document.getElementById("timer").innerHTML=m+":"+s;

},1000);

</script>

</body>
</html>
