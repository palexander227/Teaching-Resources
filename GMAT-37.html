<!DOCTYPE html>
<html>
<head>

<title>GMAT Diagnostic</title>

<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>

body{
font-family:Arial;
max-width:800px;
margin:auto;
padding:40px;
background:#f5f5f5;
}

#box{
background:white;
padding:30px;
border-radius:8px;
box-shadow:0 0 8px rgba(0,0,0,0.1);
}

button{
margin-top:20px;
padding:10px 20px;
font-size:16px;
}

label{
display:block;
margin:6px 0;
}

</style>

</head>

<body>

<div id="box">

<h2>GMAT Diagnostic</h2>

<div id="dsLegend" style="display:none">

<b>Data Sufficiency Answer Choices</b>

<p>
A. Statement (1) alone sufficient<br>
B. Statement (2) alone sufficient<br>
C. Both together sufficient<br>
D. Each alone sufficient<br>
E. Not sufficient
</p>

</div>

<div id="question"></div>

<div id="answers"></div>

<button onclick="next()">Next</button>

<div id="score"></div>

</div>

<script>

const questions = [

{
text:"Solve \\(2x+5=17\\)",
choices:["4","5","6","7","8"],
correct:2
},

{
text:"Evaluate \\(3^4 \\cdot 3^2 / 3^3\\)",
choices:["3","9","27","81","243"],
correct:2
},

{
text:"If \\(x>y\\), which must be true?",
choices:["\\(x^2>y^2\\)","\\(x^3>y^3\\)","\\(x-y>0\\)","\\(x/y>1\\)","\\(x^2-y^2>0\\)"],
correct:2
},

{
text:"DATA SUFFICIENCY<br><br>Is \\(x>0\\)?<br>(1) \\(x^2>0\\)<br>(2) \\(x^3>0\\)",
choices:["A","B","C","D","E"],
correct:1,
ds:true
}

];

let i=0;
let score=0;

function render(){

let q = questions[i];

document.getElementById("question").innerHTML=q.text;

let html="";

q.choices.forEach((c,index)=>{

html+=`<label><input type="radio" name="ans" value="${index}"> ${c}</label>`;

});

document.getElementById("answers").innerHTML=html;

if(q.ds){
document.getElementById("dsLegend").style.display="block";
}

MathJax.typesetPromise();

}

function next(){

let selected=document.querySelector('input[name="ans"]:checked');

if(selected){

if(parseInt(selected.value)===questions[i].correct){
score++;
}

}

i++;

if(i>=questions.length){

document.getElementById("question").innerHTML="";
document.getElementById("answers").innerHTML="";
document.querySelector("button").style.display="none";

document.getElementById("score").innerHTML="Score: "+score+" / "+questions.length;

return;
}

render();

}

render();

</script>

</body>

</html>
